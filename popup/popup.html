<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页分区截图</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 12h18M12 3v18" />
        </svg>
      </div>
      <div>
        <h1>网页分区截图</h1>
        <p class="subtitle">拖拽标尺划分区域，保存为 PNG</p>
      </div>
    </header>

    <section class="actions">
      <button id="startBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
        开始裁切 PNG
      </button>
      <button id="clearBtn" class="btn btn-danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        一键清空参考线
      </button>
      <button id="toggleRulerBtn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M12 3v18"/></svg>
        隐藏标尺
      </button>
    </section>

    <section class="info">
      <div class="info-item">
        <span class="info-label">参考线数量</span>
        <span id="guideCount" class="info-value">0</span>
      </div>
      <div class="info-item">
        <span class="info-label">标尺状态</span>
        <span id="rulerState" class="info-value">-</span>
      </div>
    </section>

    <section class="hint">
      <p>
        <strong>使用提示：</strong>在页面顶部或左侧标尺上按住鼠标左键并拖动，即可拖出参考线。点击参考线可显示删除按钮。
      </p>
      <p class="small">图片命名：<code>序号_网页名称.png</code></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
